name: Build and Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DossyAI.sln

      - name: Build
        run: dotnet build DossyAI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DossyAI.sln --no-build --configuration Release --verbosity normal
